name: Fetch stock photos

# Downloads the Pexels photos the content links to into public/photos (scripts/fetch-stock-photos.mjs), commits them
# and publishes the site again. Runs when this file changes or by hand.
on:
  push:
    branches: [main]
    paths: [.github/workflows/fetch-photos.yml, scripts/fetch-stock-photos.mjs]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: node scripts/fetch-stock-photos.mjs
      - run: node scripts/sync-shared.mjs
      - name: Commit the photos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add public/photos content/baseline.json supabase
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Stockbilder hämtade till public/photos"
          git push
      # A push made with the workflow's own token starts no workflows, so the deploy is started by hand.
      - run: gh workflow run deploy-pages.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}

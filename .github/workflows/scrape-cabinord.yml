name: Fetch Cabinord products

# Fetches the products, texts, prices and photos from cabinord.se into the repository
# (scripts/scrape-cabinord.mjs) and commits them. Runs when the script or this file changes, or by hand.
on:
  push:
    branches: [main]
    paths: [.github/workflows/scrape-cabinord.yml, scripts/scrape-cabinord.mjs]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm i --no-save cheerio@1
      - run: node scripts/scrape-cabinord.mjs
      - name: Commit what was fetched
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add scrape public/photos/cabinord
          if git diff --cached --quiet; then echo "Nothing new"; exit 0; fi
          git commit -m "Produkter och bilder hämtade från cabinord.se"
          git pull --rebase origin main
          git push
